# Standard AI10 entities and local automations; no HA automation is needed.
# Hardware, credentials, external_components and substitutions stay in the device YAML.
substitutions:
  ai10_ha_camera: camera.vhodna_vrata_kamera
  ai10_archive_directory: /media
  ai10_auto_capture: "true"
  ai10_failure_threshold: "3"
  ai10_fallback: "true"
  ai10_timeout: "30"

esphome:
  on_boot:
    priority: -100
    then:
      - binary_sensor.template.publish:
          id: ai_unlock_pulse
          state: false
      - delay: 6s
      - lambda: id(ai10_sensor)->refresh_users();
      - wait_until:
          condition:
            lambda: return !id(ai10_sensor)->is_busy();
          timeout: 25s
      - lambda: |-
          if (!id(ai10_sensor)->is_busy())
            id(ai10_sensor)->start_recognition(${ai10_timeout}, true);

dfrobot_ai10:
  id: ai10_sensor
  uart_id: uart_ai10
  auto_refresh_users: true
  resume_recognition_after_refresh: true
  documented_qr: false
  allow_sensitive_transfers: true
  on_recognized:
    then:
      - lambda: |-
          id(ai_last_name).publish_state(name);
          id(ai_last_uid).publish_state(uid);
          id(ai_last_type).publish_state(uid > 1000 ? "Dlan" : "Obraz");
          id(ai_last_admin).publish_state(id(ai10_sensor)->get_last_admin());
          id(ai_event).publish_state("Prepoznavanje uspešno");
      - script.execute: ai_recognition_pulse
  on_recognition_failed:
    then:
      - script.stop: ai_recognition_pulse
      - lambda: |-
          id(ai_unlock_pulse).publish_state(false);
          id(ai_event).publish_state("Prepoznavanje neuspešno: " + std::to_string(result));
  on_enrollment_success:
    then:
      - lambda: |-
          id(ai_enrollment_result).publish_state("Registracija uspešna, UID: " + std::to_string(uid));
  on_enrollment_failed:
    then:
      - lambda: |-
          id(ai_enrollment_result).publish_state("Registracija neuspešna: " + std::to_string(result));
  on_qr_scanned:
    then:
      - lambda: id(ai_last_qr).publish_state(qr_data);
  on_user_directory:
    then:
      - lambda: |-
          id(ai_directory_status).publish_state("Osveženo: " + std::to_string(count));
  on_user_directory_failed:
    then:
      - lambda: |-
          id(ai_directory_status).publish_state("Napaka: " + std::to_string(result));

dfrobot_ai10_camera:
  id: ai10_camera
  name: "Vhodna vrata kamera"
  ai10_id: ai10_sensor
  max_image_bytes: 49152
  auto_capture_enabled: ${ai10_auto_capture}
  failed_capture_threshold: ${ai10_failure_threshold}
  fallback_snapshot: ${ai10_fallback}
  archive_retry_interval: 60s
  on_archive_request:
    then:
      - if:
          condition:
            api.connected:
          then:
            - homeassistant.action:
                action: camera.snapshot
                data:
                  entity_id: ${ai10_ha_camera}
                data_template:
                  filename: "${ai10_archive_directory}/ai10_{{ now().strftime('%Y%m%d_%H%M%S_%f') }}_{{ archive_id }}.jpg"
                variables:
                  archive_id: !lambda return token;
                on_success:
                  - lambda: id(ai10_camera)->archive_result(token, true);
                on_error:
                  - lambda: id(ai10_camera)->archive_result(token, false);
          else:
            - lambda: id(ai10_camera)->archive_result(token, false);

api:
  actions:
    - action: enroll_user
      variables:
        user_name: string
        is_admin: bool
      then:
        - lambda: |-
            if (!id(ai10_camera)->is_auto_capture_active() && !user_name.empty() && user_name.size() <= 31)
              id(ai10_sensor)->enroll_user(is_admin, user_name.c_str(), 30);
    - action: delete_user
      variables:
        uid: int
      then:
        - lambda: |-
            if (!id(ai10_camera)->is_auto_capture_active() && uid >= 1 && uid <= 2000)
              id(ai10_sensor)->delete_user(uint16_t(uid));
    - action: start_recognition
      variables:
        timeout: int
        continuous: bool
      then:
        - lambda: |-
            if (!id(ai10_camera)->is_auto_capture_active() && timeout >= 1 && timeout <= 255)
              id(ai10_sensor)->start_recognition(uint8_t(timeout), continuous);
    - action: refresh_users
      then:
        - lambda: |-
            if (!id(ai10_camera)->is_auto_capture_active()) id(ai10_sensor)->refresh_users();

script:
  - id: ai_recognition_pulse
    mode: restart
    then:
      - binary_sensor.template.publish:
          id: ai_unlock_pulse
          state: true
      - delay: 2s
      - binary_sensor.template.publish:
          id: ai_unlock_pulse
          state: false

text:
  - platform: template
    name: "Ime novega uporabnika"
    id: ai_new_user_name
    mode: text
    optimistic: true
    min_length: 0
    max_length: 31
    initial_value: ""
    restore_value: false

switch:
  - platform: template
    name: "Samodejni zajem po treh napakah"
    id: ai_auto_archive
    lambda: return id(ai10_camera)->is_auto_capture_enabled();
    turn_on_action:
      - lambda: id(ai10_camera)->set_auto_capture_enabled(true);
    turn_off_action:
      - lambda: id(ai10_camera)->set_auto_capture_enabled(false);
  - platform: template
    name: "Nov uporabnik je administrator"
    id: ai_new_user_admin
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: restart
    name: "Ponovni zagon ESP32"

number:
  - platform: template
    name: "UID uporabnika"
    id: ai_selected_uid
    min_value: 1
    max_value: 2000
    step: 1
    optimistic: true
    initial_value: 1
    restore_value: false
    mode: box
  - platform: template
    name: "Čas prepoznavanja"
    id: ai_recognition_timeout
    min_value: 1
    max_value: 255
    step: 1
    unit_of_measurement: s
    optimistic: true
    initial_value: ${ai10_timeout}
    restore_value: true
    mode: box

button:
  - platform: template
    name: "Zajemi fotografijo"
    icon: mdi:camera
    on_press:
      - lambda: |-
          if (!id(ai10_camera)->is_auto_capture_active()) id(ai10_camera)->take_snapshot();
  - platform: template
    name: "Zajemi obraz 320x320"
    icon: mdi:face-recognition
    on_press:
      - lambda: |-
          if (!id(ai10_camera)->is_auto_capture_active()) id(ai10_camera)->take_face_snapshot();
  - platform: template
    name: "Začni samodejno prepoznavanje"
    on_press:
      - lambda: |-
          if (!id(ai10_camera)->is_auto_capture_active())
            id(ai10_sensor)->start_recognition(uint8_t(id(ai_recognition_timeout).state), true);
  - platform: template
    name: "Enkratno prepoznavanje"
    on_press:
      - lambda: |-
          if (!id(ai10_camera)->is_auto_capture_active())
            id(ai10_sensor)->start_recognition(uint8_t(id(ai_recognition_timeout).state), false);
  - platform: template
    name: "Ustavi prepoznavanje"
    on_press:
      - script.stop: ai_recognition_pulse
      - lambda: |-
          id(ai10_camera)->cancel_auto_capture();
          id(ai_unlock_pulse).publish_state(false);
          id(ai10_sensor)->stop_recognition();
  - platform: template
    name: "Registriraj novega uporabnika"
    on_press:
      - lambda: |-
          if (id(ai10_camera)->is_auto_capture_active()) return;
          const auto &name=id(ai_new_user_name).state;
          if (name.empty() || name.size()>31) {
            id(ai_enrollment_result).publish_state("Neveljavno ime (1–31 bajtov)");
            return;
          }
          id(ai10_sensor)->enroll_user(id(ai_new_user_admin).state, name.c_str(), 30);
  - platform: template
    name: "Izbriši uporabnika z izbranim UID"
    on_press:
      - lambda: |-
          if (!id(ai10_camera)->is_auto_capture_active())
            id(ai10_sensor)->delete_user(uint16_t(id(ai_selected_uid).state));
  - platform: template
    name: "Osveži registrirane uporabnike"
    on_press:
      - lambda: |-
          if (!id(ai10_camera)->is_auto_capture_active()) id(ai10_sensor)->refresh_users();
  - platform: template
    name: "Preberi QR kodo"
    on_press:
      - lambda: |-
          if (!id(ai10_camera)->is_auto_capture_active()) id(ai10_sensor)->scan_qr_code(15);

text_sensor:
  - platform: template
    name: "Stanje arhiviranja fotografije"
    lambda: return id(ai10_camera)->get_archive_status();
    update_interval: 1s
  - platform: template
    name: "Stanje zajema fotografije"
    lambda: return id(ai10_camera)->get_capture_status();
    update_interval: 1s
  - platform: template
    name: "Zadnji prepoznani uporabnik"
    id: ai_last_name
    update_interval: never
  - platform: template
    name: "Vrsta prepoznavanja"
    id: ai_last_type
    update_interval: never
  - platform: template
    name: "Zadnja QR koda"
    id: ai_last_qr
    update_interval: never
  - platform: template
    name: "Rezultat registracije"
    id: ai_enrollment_result
    update_interval: never
  - platform: template
    name: "Zadnji dogodek AI10"
    id: ai_event
    update_interval: never
  - platform: template
    name: "Stanje seznama uporabnikov"
    id: ai_directory_status
    update_interval: never
  - platform: template
    name: "Registrirani uporabniki - seznam"
    lambda: return id(ai10_sensor)->get_user_summary();
    update_interval: 3s
  - platform: template
    name: "Registrirani uporabniki - UID"
    lambda: |-
      if (!id(ai10_sensor)->is_user_list_complete()) return std::string();
      std::string out;
      for (auto uid : id(ai10_sensor)->get_user_ids()) {
        auto s=std::to_string(uid);
        if (out.size()+s.size()+2>240) { out+="..."; break; }
        if (!out.empty()) out+=", ";
        out+=s;
      }
      return out;
    update_interval: 3s

sensor:
  - platform: template
    name: "Zaporedna neuspešna prepoznavanja"
    accuracy_decimals: 0
    lambda: return id(ai10_camera)->get_failed_count();
    update_interval: 1s
  - platform: template
    name: "Velikost fotografije"
    unit_of_measurement: "kB"
    accuracy_decimals: 2
    lambda: return id(ai10_camera)->get_image_size()/1000.0f;
    update_interval: 1s
  - platform: template
    name: "Zadnji prepoznani UID"
    id: ai_last_uid
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: "Število registriranih uporabnikov"
    accuracy_decimals: 0
    lambda: |-
      if (!id(ai10_sensor)->is_user_list_complete()) return NAN;
      return float(id(ai10_sensor)->get_user_count());
    update_interval: 3s
  - platform: template
    name: "Število registriranih obrazov"
    accuracy_decimals: 0
    lambda: |-
      if (!id(ai10_sensor)->is_user_list_complete()) return NAN;
      unsigned n=0;
      for (auto uid:id(ai10_sensor)->get_user_ids()) if (uid<=1000) ++n;
      return float(n);
    update_interval: 3s
  - platform: template
    name: "Število registriranih dlani"
    accuracy_decimals: 0
    lambda: |-
      if (!id(ai10_sensor)->is_user_list_complete()) return NAN;
      unsigned n=0;
      for (auto uid:id(ai10_sensor)->get_user_ids()) if (uid>1000) ++n;
      return float(n);
    update_interval: 3s

binary_sensor:
  - platform: template
    name: "Fotografija čaka na arhiviranje"
    lambda: return id(ai10_camera)->has_pending_archive();
  - platform: template
    name: "Zajem fotografije v teku"
    lambda: return id(ai10_camera)->is_capturing();
  - platform: template
    name: "Prepoznavanje uspešno - impulz"
    id: ai_unlock_pulse
  - platform: template
    name: "Zadnji prepoznani je administrator"
    id: ai_last_admin
  - platform: template
    name: "Obraz ali dlan zaznana"
    lambda: return id(ai10_sensor)->is_face_detected();
  - platform: template
    name: "Seznam uporabnikov popoln"
    lambda: return id(ai10_sensor)->is_user_directory_complete();
  - platform: status
    name: "ESP32 povezava"
