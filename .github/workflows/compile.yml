name: ESPHome validation
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [esp32-c6-devkitc-1, esp32-s3-devkitc-1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install esphome
      - run: |
          sed "s/BOARD_NAME/${{ matrix.board }}/g" tests/compile.yaml.in > ci.yaml
          esphome config ci.yaml
          esphome compile ci.yaml
