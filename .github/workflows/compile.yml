name: ESPHome validation
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
jobs:
  user-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++17 -Wall -Wextra -Werror -I components/dfrobot_ai10 tests/test_users.cpp -o /tmp/ai10-test-users
      - run: /tmp/ai10-test-users
      - run: g++ -std=c++17 -Wall -Wextra -Werror -I components/dfrobot_ai10 tests/test_frame.cpp -o /tmp/ai10-test-frame && /tmp/ai10-test-frame
      - run: g++ -std=c++17 -Wall -Wextra -Werror -I components/dfrobot_ai10 tests/test_directional.cpp -o /tmp/ai10-test-directional && /tmp/ai10-test-directional
      - run: g++ -std=c++17 -Wall -Wextra -Werror -I components/dfrobot_ai10 tests/test_watchdog.cpp -o /tmp/ai10-test-watchdog && /tmp/ai10-test-watchdog
      - run: g++ -std=c++17 -Wall -Wextra -Werror -I components/dfrobot_ai10 tests/test_verify_diagnostics.cpp -o /tmp/ai10-test-verify && /tmp/ai10-test-verify
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [esp32-c6-devkitc-1, esp32-s3-devkitc-1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install esphome
      - run: |
          sed "s/BOARD_NAME/${{ matrix.board }}/g" tests/compile.yaml.in > ci.yaml
          esphome config ci.yaml
          esphome compile ci.yaml
      - run: |
          sed "s/BOARD_NAME/${{ matrix.board }}/g" tests/package.yaml.in > package-ci.yaml
          esphome config package-ci.yaml
          esphome compile package-ci.yaml
